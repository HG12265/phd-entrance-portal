services:
  mysql:
    image: mysql:8.0
    container_name: phd_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=1000 --innodb-buffer-pool-size=1G --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_DATABASE: ${DB_NAME:-phd_entrance_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phd_backend
    command: sh -c "python scripts/create_default_admin.py && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --workers $${WEB_CONCURRENCY:-4} --bind 0.0.0.0:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: phd_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - backend_uploads:/app/uploads
      - nginx_logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
  backend_uploads:
  backend_logs:
  nginx_logs:
