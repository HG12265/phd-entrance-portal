upstream backend_server {
    server backend:8000;
}

# Unified HTTP and HTTPS Server
server {
    listen 80;
    listen 443 ssl;
    server_name phd-entrance.periyaruniversity.ac.in entrance.periyaruniversity.ac.in localhost;

    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # SSL protocols and optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upload limit for excel sheets, candidate photos, and questions
    client_max_body_size 100M;

    # Timeouts suitable for large uploads and long requests
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    send_timeout          600s;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve built frontend static React assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static Candidate Photos route served directly by Nginx for high performance
    location /static/candidate_photos/ {
        alias /app/uploads/candidate_photos/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Static Question Images route served directly by Nginx for high performance
    location /static/question_images/ {
        alias /app/uploads/question_images/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to backend FastAPI application
    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://$host/ https://$host/;
    }

    # Optionally proxy Swagger / OpenAPI docs (restrict via ENABLE_DOCS on backend)
    location /docs {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_redirect http://$host/ https://$host/;
    }
    location /openapi.json {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_redirect http://$host/ https://$host/;
    }

    # Error handling pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
